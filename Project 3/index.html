<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Netflix Clone</title>
</head>

<body>
    <div class="body-container">
        <nav>
            <img src="./assets/imgs/logo.png" alt="logo" class="logo">
            <ul class="nav-links">
                <li>Home</li>
                <li>TV Shows</li>
                <li>Movies</li>
                <li>Latest</li>
                <li>My List</li>
            </ul>
            <div class="search-bar">
                <i class="fa fa-search" aria-hidden="true"></i>
                <input type="text" placeholder="Search">
            </div>
        </nav>
        <div class="container">
            <figure>
                <img src="./assets/imgs/name.png" alt="Movie Name">
            </figure>
            <div class="details">
                <span>2021</span>
                <span><small>12+</small></span>
                <span>1h 55min</span>
                <span>Action</span>
            </div>
            <div class="content">
                <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Quia iusto, animi dolorum explicabo
                    praesentium illo nam! Iste nam veritatis provident recusandae nostrum culpa aperiam minima, sunt
                    numquam omnis, magnam ut.</p>
            </div>
            <div class="btn-container">
                <button><i class="fa fa-play" aria-hidden="true"></i> PLAY</button>
                <button><i class="fa fa-plus" aria-hidden="true"></i> MY LIST</button>
            </div>
        </div>
    </div>
</body>

</html>
